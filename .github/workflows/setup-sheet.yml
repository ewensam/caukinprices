name: Set up sheet (one-time)

on:
  workflow_dispatch:
    inputs:
      starter_data:
        description: Load the starter items and sample stud-wall quote
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Build tabs, formulas and dropdowns
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: caukin setup-sheet ${{ inputs.starter_data && ' ' || '--empty' }}
