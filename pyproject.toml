[project]
name = "caukin-prices"
version = "0.1.0"
description = "Materials price-bank and quoting tool for CAUKIN Construct (Google Sheets + GitHub Actions)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "gspread>=6.1",               # thin Sheets API client with service-account auth built in
    "tzdata; sys_platform == 'win32'",  # zoneinfo data for Europe/London on Windows dev machines
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]    # fallback for pages without JSON-LD; heavy, so opt-in
dev = ["pytest>=8"]

[project.scripts]
caukin = "caukin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caukin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
